<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GAINN</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#06090E; --red:#FF4A2B; --tx:#F4F7FB;
  --sans:'Instrument Sans',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html{height:100%}
body{
  margin:0;min-height:100svh;background:var(--ink);color:var(--tx);
  font-family:var(--sans);overflow-x:hidden;
  display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(780px 580px at 50% 46%,rgba(30,55,101,.40),rgba(6,9,14,0) 70%)}
.grain{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;opacity:.10}

header{position:relative;z-index:2;padding:clamp(26px,3.4vw,38px) clamp(24px,4vw,48px)}
.brand{display:inline-flex;align-items:center;gap:13px;text-decoration:none}
.brand span{width:7px;height:7px;border-radius:50%;background:var(--red);
  box-shadow:0 0 12px rgba(255,74,43,.75)}
.brand b{font-weight:600;font-size:21px;letter-spacing:.13em;color:#F4F7FB}

main{position:relative;z-index:2;flex:1;display:grid;place-items:center;
  padding:0 24px clamp(60px,10vw,110px)}
h1{margin:0;font-family:var(--mono);font-weight:400;
  font-size:clamp(23px,5.6vw,58px);line-height:1.15;letter-spacing:.28em;
  text-transform:uppercase;text-align:center;text-indent:.28em;color:#F6F9FD}
.rule{width:min(320px,54vw);height:1px;margin:clamp(26px,4vw,40px) auto 0;
  background:linear-gradient(90deg,rgba(255,74,43,0),rgba(255,74,43,.85),rgba(255,74,43,0))}

@media(prefers-reduced-motion:no-preference){
  .lift{opacity:0;transform:translateY(14px);animation:rise 1.1s cubic-bezier(.22,1,.36,1) forwards}
  .brand.lift{animation-delay:.05s}
  h1.lift{animation-delay:.25s}
  .rule.lift{animation-delay:.55s}
}
@keyframes rise{to{opacity:1;transform:none}}
</style>
</head>
<body>

<div class="glow"></div>
<svg class="grain" aria-hidden="true"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" fill="transparent" filter="url(#gr)"/></svg>

<header>
  <a class="brand lift" href="/"><span></span><b>GAINN</b></a>
</header>

<main>
  <div>
    <h1 class="lift">Coming soon</h1>
    <div class="rule lift"></div>
  </div>
</main>

</body>
</html>
